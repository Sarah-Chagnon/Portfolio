<!DOCTYPE html>
<html lang="fr">
<head>
	<title>Exercice 3D #3</title>
	<meta  charset="UTF-8" />
	<link rel="stylesheet" href="exercice3D_03.css">
</head>
<body>
	<!------ Entête -------->
	<div class="entete bg-bleu">
		<img id="logo" src="images/logo.png" alt="logo.png">
		<h1>Voyages Capitales</h1>
	</div>
	
	<!------ Contenu principal ----->
	<div class="contenu-principal">
		<!------ Zone flexible des capitales -------->
		<div class="capitales">
			<div class="bg-vert">
				<img class="capitales-photos" src="images/lisbonne.jpg" alt="Lisbonne"/>
				<h3>Lisbonne<br/>Portugal</h3>
			</div>
			<div class="bg-bleu">
				<img class="capitales-photos" src="images/londres.jpg" alt="Londres"/>
				<h3>Londres<br/>Royaume-Unis</h3>
			</div>
			<div class="bg-vert">
				<img class="capitales-photos" src="images/moscou.jpg" alt="Moscou"/>
				<h3>Moscou<br/>Russie</h3>
			</div>
			<div class="bg-bleu">
				<img class="capitales-photos" src="images/paris.jpg" alt="Paris"/>
				<h3>Paris<br/>France</h3>
			</div>
			<div class="bg-vert">
				<img class="capitales-photos" src="images/prague.jpg" alt="Prague"/>
				<h3>Prague<br/>République Tchèque</h3>
			</div>
			<div class="bg-bleu">
				<img class="capitales-photos" src="images/rome.jpg" alt="Rome"/>
				<h3>Rome<br/>Italie</h3>
			</div>
			<div class="bg-vert">
				<img class="capitales-photos" src="images/vienne.jpg" alt="Vienne"/>
				<h3>Vienne<br/>Autriche</h3>
			</div>
		</div>
		<!------ Menu à droite -------->
		<div class=" menu bg-vert">
			<div>Informations</div>
			<div>Destinations</div>
			<div>Réservations</div>
			<div>Modifications</div>
		</div>
	</div>
	<!------ Pied de page ----->
	<div class="pied-page bg-bleu">
		Fait par ...
	</div>
</body>
</html>
